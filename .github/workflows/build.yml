name: build

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew build -x test
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew build -x test

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" --reverse)
          else
            LOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s" --reverse)
          fi
          echo "$LOG" > changelog.md
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          cat changelog.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Determine release type
        id: release
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == 0.* ]] || echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-alpha'; then
            echo "type=alpha" >> $GITHUB_OUTPUT
          elif echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-beta'; then
            echo "type=beta" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: WxxC2EJe
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          version: ${{ steps.release.outputs.version }}
          version-type: ${{ steps.release.outputs.type }}
          changelog: ${{ steps.changelog.outputs.changelog }}
          game-versions: 26.2
          loaders: fabric neoforge
          files: build/libs/native-threading-*.jar
